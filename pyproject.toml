[project]
name = "fraud-detection"
version = "0.1.0"
description = "Framework comparativo de detecção de fraudes com XGBoost, Isolation Forest, Autoencoder e GNN"
requires-python = ">=3.10"

dependencies = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "pytorch-tabnet>=3.1",
    "torch>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "torch-geometric>=2.7.0",
    "faiss-cpu>=1.7",
]

[project.scripts]
run-experiments      = "run_experiments:main"
characterize-datasets = "characterize_datasets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
    "Credit Card Fraud Detection/",
    "ieee-fraud-detection/",
    "plots/",
    "__pycache__/",
]
